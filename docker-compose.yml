services:
  postgres:
    image: postgres:16-alpine
    container_name: lift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lift_user
      POSTGRES_PASSWORD: lift_password
      POSTGRES_DB: lift_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lift_user -d lift_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
