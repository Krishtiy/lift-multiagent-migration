services:
  lift-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lift-migration-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LIFT_DATABASE_URL=postgresql://lift_user:lift_password@postgres:5432/lift_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/workspace

  postgres:
    image: postgres:16-alpine
    container_name: lift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lift_user
      POSTGRES_PASSWORD: lift_password
      POSTGRES_DB: lift_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lift_user -d lift_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
